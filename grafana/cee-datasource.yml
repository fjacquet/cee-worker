# Second Prometheus datasource, uid cee-prometheus, matching what the
# upstream cee-exporter/dashboards/cee-exporter.json panels expect.
# Same Prometheus instance as pstore_exporter's "Prometheus" datasource
# (uid: prometheus) — just registered under the uid this dashboard needs,
# so the dashboard works unmodified from the cee-exporter repo.
apiVersion: 1

datasources:
  - name: cee-prometheus
    uid: cee-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      # Must match the cee-exporter job's scrape_interval in
      # prometheus.test.yml. Grafana uses it as the minimum step and to compute
      # $__rate_interval = max($__interval + timeInterval, 4 * timeInterval);
      # declaring 15s against 10s data skips roughly one sample in three.
      timeInterval: 10s
