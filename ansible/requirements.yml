---
# Collections this playbook needs beyond ansible-core.
#
#     ansible-galaxy collection install -r ansible/requirements.yml
#
# ansible.posix supplies ansible.posix.firewalld, used by cee_configure to
# open the CEE inbound port. It is NOT bundled with ansible-core, so a
# clean checkout fails --syntax-check and ansible-lint without this.
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  # community.general supplies community.general.zypper, used by the SLES
  # branch of cee_install. Like ansible.posix it is not bundled with
  # ansible-core, so its absence breaks --syntax-check and ansible-lint on
  # a clean checkout, not just deployment.
  #
  # Floor is 12.0.0 on purpose: that release removed the community.general
  # yaml stdout callback, and ansible.cfg documents having been bitten by
  # a control node where it was still expected. Requiring >= 12 makes the
  # removal a stated assumption rather than an accident of what happens to
  # be installed.
  - name: community.general
    version: ">=12.0.0"

  # ansible.windows supplies win_package, win_regedit, win_service,
  # win_service_info, win_firewall_rule, win_wait_for, win_copy, win_stat
  # and the Windows implementation of `setup`. That last one matters more
  # than it looks: site.yml sets gather_facts: true, and
  # ansible.builtin.setup is a POSIX module executed target-side under
  # Python — which a Windows Server does not have. Without this
  # collection a Windows host crashes during fact gathering, before the
  # OS-family gate can say anything useful about it.
  - name: ansible.windows
    version: ">=2.5.0"

  # community.windows supplies community.windows.win_firewall_rule, used
  # by the Windows branch of cee_configure. ansible.windows ships
  # win_firewall (enable/disable a profile) but not the per-rule module,
  # so both Windows collections are needed, not one.
  - name: community.windows
    version: ">=3.0.0"
