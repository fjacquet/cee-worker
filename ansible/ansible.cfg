[defaults]
roles_path = roles
inventory = inventory/hosts.yml
host_key_checking = True
# `stdout_callback = yaml` resolved to community.general.yaml, which was
# removed in community.general 12.0.0 — on a control node with a current
# `ansible` package installed it makes `ansible-playbook site.yml` abort
# before the first task. ansible-core's own default callback has produced
# the same YAML-formatted results since 2.13 via callback_result_format.
callback_result_format = yaml
interpreter_python = auto_silent
