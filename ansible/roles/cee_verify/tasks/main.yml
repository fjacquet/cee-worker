---
# The container failed silently: empty logs, no signal, nothing to
# diagnose. Verification is a first-class step here, and each assertion
# names the specific thing that is wrong.

- name: Flush handlers so any pending restart happens before verification
  ansible.builtin.meta: flush_handlers

- name: Query the emc_cee unit state
  ansible.builtin.systemd_service:
    name: emc_cee
  register: cee_verify_unit
  become: true

- name: Unit emc_cee must be running
  ansible.builtin.assert:
    that:
      - cee_verify_unit.status.ActiveState == 'active'
    fail_msg: >-
      emc_cee is {{ cee_verify_unit.status.ActiveState }}, not active. Check
      `journalctl -u emc_cee -n 50` and the CEE log under
      {{ cee_log_path }}.

- name: CEE must be listening on its inbound port
  ansible.builtin.wait_for:
    port: "{{ cee_http_port }}"
    host: 127.0.0.1
    state: started
    timeout: 30
  register: cee_verify_listening
  # NOTE: deliberately ignore_errors, not failed_when: false. failed_when
  # overwrites the registered result's own `failed` key with the
  # failed_when expression's value, so `failed_when: false` forces
  # cee_verify_listening.failed to False unconditionally -- a timed-out
  # wait_for and a successful one become indistinguishable, and the assert
  # below would never fire even with nothing listening. ignore_errors only
  # stops the play from halting; it leaves the module's real
  # success/failure in the registered var, which is what the next task
  # actually needs to inspect. Verified empirically: with failed_when:
  # false, `cee_verify_listening is not failed` was true even against a
  # port nothing was listening on.
  ignore_errors: true

- name: Report a missing listener with the likely cause
  ansible.builtin.assert:
    that:
      - cee_verify_listening is not failed
    fail_msg: >-
      Nothing is listening on {{ cee_http_port }}. CEE 9.x ships
      Security/Http/ServerEnabled=0 by default; confirm the rendered
      /opt/CEEPack/emc_cee_config.xml has it set to 1 and that CEE actually
      read that file.

- name: Find the CEE log files
  ansible.builtin.find:
    paths: "{{ cee_log_path }}"
    patterns: "*.log"
  register: cee_verify_logs
  become: true

- name: CEE must have written a log
  ansible.builtin.assert:
    that:
      - cee_verify_logs.files | length > 0
    fail_msg: >-
      No log files under {{ cee_log_path }}. CEE did not start, or
      LogFile/Path in the rendered config does not match. An empty log
      directory was exactly the container's failure signature.

- name: Read the CEE log
  ansible.builtin.slurp:
    src: "{{ (cee_verify_logs.files | sort(attribute='mtime') | last).path }}"
  register: cee_verify_log_content
  become: true

- name: Log must not report an unsupported platform
  ansible.builtin.assert:
    that:
      - "'Platform is not supported' not in (cee_verify_log_content.content | b64decode)"
    fail_msg: >-
      CEE reports an unsupported platform. /etc/redhat-release does not
      contain the literal Red Hat string this host claimed to have.

- name: Report the verified state
  ansible.builtin.debug:
    msg: >-
      CEE active, listening on {{ cee_http_port }}, logging to
      {{ cee_log_path }}. Endpoints:
      {% for e in cee_endpoints %}{{ e.name }}@http://{{ e.host }}:{{ e.port }}{% if not loop.last %}, {% endif %}{% endfor %}.
      Next: run the two-stage event test in docs/powerstore-setup-runbook.md.
