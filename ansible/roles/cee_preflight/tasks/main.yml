---
# First task in the first role, on purpose. No role here ships a
# defaults/main.yml: an explicit list of what must be set is worth more
# than a default that quietly renders a wrong config. Without this assert,
# a missing group_vars/all.yml gets swallowed by the ignore_errors on the
# port probe below and the play dies several tasks later on a raw Jinja
# undefined, pointing at the wrong task.
- name: Every required variable must be defined
  ansible.builtin.assert:
    that:
      - cee_http_port is defined
      - cee_https_port is defined
      - cee_endpoints is defined
      - cee_access_list_enabled is defined
      - cee_access_list is defined
      - cee_facilities is defined
      - cee_manage_firewall is defined
      - cee_log_path is defined
      - cee_cache_size is defined
      - cee_threads is defined
      - cee_debug is defined
      - cee_verbose is defined
    fail_msg: >-
      One or more required variables are undefined. These roles ship no
      defaults on purpose. Copy ansible/group_vars/all.yml.example to
      ansible/group_vars/all.yml and fill it in; every variable named in
      this assertion is documented there. Required:
      cee_http_port, cee_https_port, cee_endpoints,
      cee_access_list_enabled, cee_access_list, cee_facilities,
      cee_manage_firewall, cee_log_path, cee_cache_size, cee_threads,
      cee_debug, cee_verbose.

- name: Gather facts needed for the platform gate
  ansible.builtin.setup:
    gather_subset:
      - distribution

- name: Assert the platform is supported
  ansible.builtin.include_tasks: assert_platform.yml

- name: Check whether chrony is present
  ansible.builtin.stat:
    path: /usr/bin/chronyc
  register: cee_preflight_chronyc

- name: Time must be synchronised
  when: cee_preflight_chronyc.stat.exists
  block:
    - name: Query chrony tracking state
      ansible.builtin.command: chronyc tracking
      register: cee_preflight_chrony_tracking
      changed_when: false
      failed_when: false

    - name: Clock must not be unsynchronised
      ansible.builtin.assert:
        that:
          - cee_preflight_chrony_tracking.rc == 0
          - "'Not synchronised' not in cee_preflight_chrony_tracking.stdout"
        fail_msg: >-
          Clock is not synchronised. The PowerStore array, this CEE host and
          the consumer must agree on time or events are rejected or
          misordered. Fix chrony before continuing.

- name: Warn when chrony is absent
  ansible.builtin.debug:
    msg: >-
      chronyc not found — time synchronisation could not be verified.
      PowerStore, CEE and the consumer must share synchronised time.
  when: not cee_preflight_chronyc.stat.exists

- name: Check whether the CEE port is already in use
  ansible.builtin.wait_for:
    port: "{{ cee_http_port }}"
    host: 127.0.0.1
    state: stopped
    timeout: 3
  register: cee_preflight_port_free
  # Use ignore_errors rather than failed_when: false to preserve the module's real
  # failure status so the downstream 'is failed' check can detect port conflicts
  ignore_errors: true

- name: Report a pre-existing listener on the CEE port
  ansible.builtin.debug:
    msg: >-
      Something is already listening on {{ cee_http_port }}. If this is a
      previous emc_cee instance the playbook will reconfigure it; if it is
      another service, CEE will fail to bind.
  when: cee_preflight_port_free is failed
