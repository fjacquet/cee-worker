---
- name: Install UBI 9 repositories, disabled by default
  # The repo definitions land on the host permanently but ship
  # `enabled = 0`; the dnf task below switches them on for its own
  # transaction with `enablerepo`. See files/ubi.repo for why.
  ansible.builtin.copy:
    src: ubi.repo
    dest: /etc/yum.repos.d/ubi.repo
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Locate the bundled CEE rpm
  ansible.builtin.set_fact:
    cee_install_rpm_candidates: >-
      {{ query('ansible.builtin.fileglob',
               playbook_dir + '/../bin/emc_cee_RHEL-*.x86_64.rpm') }}

- name: Exactly one CEE rpm must be present in bin/
  ansible.builtin.assert:
    that:
      - cee_install_rpm_candidates | length == 1
    fail_msg: >-
      Expected exactly one emc_cee_RHEL-*.x86_64.rpm in bin/, found
      {{ cee_install_rpm_candidates | length }}. Remove the old rpm before
      adding a new one — the Dockerfile globs the same directory and has the
      same requirement.

- name: Record the rpm path
  ansible.builtin.set_fact:
    cee_install_rpm_local: "{{ cee_install_rpm_candidates[0] }}"

- name: Copy the CEE rpm to the target
  ansible.builtin.copy:
    src: "{{ cee_install_rpm_local }}"
    dest: /tmp/{{ cee_install_rpm_local | basename }}
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install CEE
  # Deliberately no disable_gpg_check here. That option maps to dnf
  # --nogpgcheck, which is transaction-wide: it would also suppress
  # signature verification for every UBI-sourced dependency this rpm pulls
  # in, nullifying `gpgcheck = 1` in files/ubi.repo exactly when it
  # matters. Leaving it unset restores dnf's normal behaviour —
  # repo-sourced packages are checked against the Red Hat key that
  # ubi.repo already points at
  # (/etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release), while this local
  # vendored rpm is governed by dnf's `localpkg_gpgcheck` setting, which
  # defaults to off, so it installs unverified.
  #
  # The CEE rpm IS signed (RSA/SHA256, fingerprint
  # F85417992FA59E0A84F1E2CCF4A476D807DD4467), but Dell distributes that
  # signing key only through their authenticated support portal — it is
  # not on public keyservers or in Dell's public pgp_pubkeys repo, so it
  # cannot be vendored into this repo. If that key is obtained through
  # the support portal in the future, `localpkg_gpgcheck: true` (plus
  # importing the key on the target) would close this remaining gap.
  #
  # enablerepo turns on the two UBI repos for this transaction only. They
  # are defined on the host with `enabled = 0`, so the depsolver sees the
  # same package set it would have seen with `enabled = 1` — dnf loads a
  # disabled repo's metadata as soon as --enablerepo names it — while
  # nothing outside this transaction has its package sources rewritten.
  # Requires outbound HTTPS to cdn-ubi.redhat.com from the target host.
  ansible.builtin.dnf:
    name: /tmp/{{ cee_install_rpm_local | basename }}
    state: present
    enablerepo:
      - ubi-9-baseos-rpms
      - ubi-9-appstream-rpms
  become: true
  notify: Restart emc_cee

- name: Remove the staged rpm
  ansible.builtin.file:
    path: /tmp/{{ cee_install_rpm_local | basename }}
    state: absent
  become: true

- name: Verify the CEE layout
  ansible.builtin.stat:
    path: "{{ item }}"
  register: cee_install_layout
  loop:
    - /opt/CEEPack/emc_cee.exe
    - /opt/CEEPack/emc_cee_svc
    - /etc/systemd/system/emc_cee.service
  become: true

- name: Every expected CEE path must exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      {{ item.item }} is missing after install. The rpm layout changed, or
      the install silently failed. The unit name this playbook manages is
      `emc_cee`; if the rpm now ships a different unit, update
      cee_configure and cee_verify to match.
  loop: "{{ cee_install_layout.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure the log directory exists and is writable by the service user
  ansible.builtin.file:
    path: "{{ cee_log_path }}"
    state: directory
    owner: ceesvc
    group: ceesvc
    mode: "0750"
  become: true
