---
# Windows branch. Nothing is shared with the Linux ones: a different
# artefact, a different package manager, a different layout.
#
# Two entry states are supported, because both occur in practice:
#
#   the host does not carry cee_windows_version  -> stage bin/ and install
#   the host already has it registered           -> skip straight to the checks
#
# The second is not a convenience. Windows CEE hosts are routinely handed
# over with CEE already on them — both test VMs this repo has seen
# arrived that way, carrying 9.3.0.0 — and Dell publishes the installers
# only through their authenticated portal, so the controller may
# legitimately hold no artefact for the release that is already on the
# target. Refusing there would mean the repo could configure only the
# hosts it had installed itself, which is the smaller half of the job.
#
# What is NOT skipped in that path is verification: the layout check and
# the version assert below run either way, so "already installed" still
# has to prove it means the release this play targets.

- name: Check whether the targeted CEE release is already registered
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{{ cee_windows_product_id }}
  register: cee_install_product_key

- name: Report that CEE is already present and bin/ is not needed
  ansible.builtin.debug:
    msg: >-
      CEE {{ cee_windows_version }} is already registered under
      {{ cee_windows_product_id }}, so nothing was staged or installed and
      bin/ needs no installer for this host. The layout and version checks
      still run below, and cee_configure will apply this repo's
      configuration to the existing install.
  when: cee_install_product_key.exists

- name: Stage and install CEE from the vendored installer
  ansible.builtin.include_tasks: install_windows_package.yml
  when: not cee_install_product_key.exists

- name: Verify the CEE layout
  ansible.windows.win_stat:
    path: "{{ item }}"
  register: cee_install_layout
  loop:
    - C:\Program Files\EMC\CEE\CAVA.exe
    - C:\Program Files\EMC\CEE\CEEMtrSvc.exe

- name: Every expected CEE path must exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      {{ item.item }} is missing after install. The installer layout
      changed, or the install silently failed. CAVA.exe is the one that
      matters most: despite its antivirus name it hosts the CEPA HTTP
      listener this deployment depends on.
  loop: "{{ cee_install_layout.results }}"
  loop_control:
    label: "{{ item.item }}"

# The ProductCode check above answers "is this GUID registered", which is
# all win_package can ask. It cannot catch a cee_windows_product_id that
# was pointed at the wrong release: an operator who bumps the version but
# leaves the old GUID gets a play that reports success against whatever
# CEE happens to be installed. CEE writes its own version into the
# registry, so read it back and judge the result on the version rather
# than on the GUID that was used to look for it.
- name: Read the installed CEE version from the registry
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\EMC\CEE
    name: Version
  register: cee_install_version_value

- name: The installed CEE version must be the one this play targets
  ansible.builtin.assert:
    that:
      - cee_install_version_value.exists
      - cee_install_version_value.value == cee_windows_version
    fail_msg: >-
      HKLM:\SOFTWARE\EMC\CEE\Version reads
      '{{ cee_install_version_value.value | default("<no value>") }}' but
      this play targets CEE {{ cee_windows_version }} via ProductCode
      {{ cee_windows_product_id }}. The version and the GUID disagree, so
      one of them is wrong — they are set as a pair in
      group_vars/cee_windows.yml and must be changed together. Known
      pairs are listed in group_vars/cee_windows.yml.example.
