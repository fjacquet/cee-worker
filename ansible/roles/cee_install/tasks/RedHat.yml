---
- name: Install UBI 9 repositories, disabled by default
  # The repo definitions land on the host permanently but ship
  # `enabled = 0`; the dnf task below switches them on for its own
  # transaction with `enablerepo`. See files/ubi.repo for why.
  ansible.builtin.copy:
    src: ubi.repo
    dest: /etc/yum.repos.d/ubi.repo
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Look for the RHEL build of the rpm
  ansible.builtin.set_fact:
    cee_install_rpm_glob: emc_cee_RHEL-*.x86_64.rpm

- name: Locate and stage the rpm
  ansible.builtin.include_tasks: install_linux_locate.yml

- name: Install CEE
  # disable_gpg_check is set, and the reasoning that previously argued
  # against it was wrong on both of its factual claims. Both were
  # corrected against a real RHEL 9.8 host; neither had ever been
  # executed before.
  #
  # It claimed dnf's `localpkg_gpgcheck` "defaults to off, so it installs
  # unverified". It does not. Without this flag, RHEL 9.8 fails with:
  #     Failed to validate GPG signature for emc_cee-9.2-0.0.x86_64:
  #     Public key for emc_cee_RHEL-9.2.0.0.x86_64.rpm is not installed
  # The install never worked on a real host.
  #
  # It also claimed --nogpgcheck is dangerous here because it would
  # suppress verification for "every UBI-sourced dependency this rpm
  # pulls in". It pulls in none. Measured with `dnf install --assumeno`
  # on RHEL 9.8 with both UBI repos enabled:
  #     Installing:
  #      emc_cee   x86_64   9.2-0.0   @commandline   4.1 M
  #     Transaction Summary — Total size: 4.1 M
  # One package, from @commandline. On this 9.8 host's package set, the
  # blast radius of this flag is exactly this rpm, and nothing else.
  #
  # What that costs: the trust anchor moves from Dell's signature to this
  # repo's own tracked artefact. The rpm IS signed (RSA/SHA256, key ID
  # F4A476D807DD4467) but Dell ships that key only through their
  # authenticated support portal — confirmed absent from public
  # keyservers (404) and from Dell's public pgp_pubkeys paths. Anyone
  # with portal access should fetch it, vendor it, `rpm --import` it on
  # the target, and drop this flag: that is strictly better than what
  # this line does. And `disable_gpg_check` is transaction-wide in
  # `ansible.builtin.dnf` — it covers repository-sourced packages as well
  # as the local one, not just the local package. The @commandline-only
  # measurement above is evidence about this host's package set, not a
  # structural guarantee: if a minimal host ever does pull a
  # UBI-sourced dependency to satisfy this rpm, that dependency installs
  # unverified too. The flag protects nothing inside the transaction; it
  # only reflects what was already unverified on the host outside it.
  #
  # The UBI repos are kept because a minimal RHEL host may lack what this
  # 9.8 image happens to have. They cost one metadata fetch and remove a
  # class of failure; enablerepo turns them on for this transaction only,
  # so nothing outside it has its package sources rewritten. Requires
  # outbound HTTPS to cdn-ubi.redhat.com from the target host.
  ansible.builtin.dnf:
    name: /tmp/{{ cee_install_rpm_local | basename }}
    state: present
    disable_gpg_check: true
    enablerepo:
      - ubi-9-baseos-rpms
      - ubi-9-appstream-rpms
  become: true
  notify: Restart emc_cee

- name: Verify the installed layout
  ansible.builtin.include_tasks: install_linux_verify.yml
