# Combined test stack: cee-worker + cee-exporter + pstore_exporter + grafana + pstcli.
# All images pulled from GHCR — no local builds. See
# docs/superpowers/specs/2026-08-07-test-stack-design.md for the design.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml run --rm pstcli -version
#
# Requires ../pstore_exporter checked out as a sibling directory (for
# Grafana's bundled PowerStore dashboards).
#
# cee-exporter is pinned to a semver tag. Upstream publishes both
# ":latest" and bare semver ("5.3.1", no v prefix) — the GitHub release is
# tagged "v5.3.1" but the container tag carries no v, so pinning the
# release name would silently fail to resolve. Override with
# CEE_EXPORTER_TAG=<tag> to test another build.
#
# Do not pin below 5.1.0 while [output] type = "evtx". Every .evtx written
# by a non-Windows build before 5.1.0 is unreadable by Windows —
# Get-WinEvent reports "The event log file is corrupted" — and the files
# cannot be repaired afterwards. That bug shipped in every release since
# v2 and went unnoticed because nothing upstream ever read one back.

services:
  cee:
    image: ghcr.io/${GHCR_OWNER:-fjacquet}/cee-worker:latest
    container_name: test_cee
    ports:
      - "12228:12228"
    volumes:
      - ./config/emc_cee_config.xml:/opt/CEEPack/emc_cee_config.xml:ro
      - ./logs:/opt/CEEPack/logs
    restart: unless-stopped

  cee-exporter:
    image: ghcr.io/${GHCR_OWNER:-fjacquet}/cee-exporter:${CEE_EXPORTER_TAG:-5.3.1}
    container_name: test_cee_exporter
    # 12229:12228 rather than 12228:12228. CEE's inbound listener owns
    # 12228 by specification, and with CEE now on a VM its consumer must
    # be reachable off-host. Publishing the exporter on 12229 lets the CEE
    # host and the Docker host be the same machine without colliding.
    ports:
      - "9228:9228"
      - "12229:12228"
    volumes:
      - ./cee-exporter-config.toml:/etc/cee-exporter/config.toml:ro
      # The image runs as uid 65532, and go-evtx opens the evtx file eagerly
      # at startup — so this directory must exist and be owned by 65532
      # before the stack comes up, or the container exits 1 with
      # writer_init_failed. It is committed (logs/cee-exporter/.gitkeep) so a
      # fresh checkout does not let Docker create it root-owned; you still
      # need the one-time chown:
      #   sudo chown 65532:65532 logs/cee-exporter
      # Do not "fix" a permission error by adding user: "0:0" here — running
      # non-root is deliberate hardening upstream.
      - ./logs/cee-exporter:/var/log/cee-exporter
    restart: unless-stopped

  pstore_exporter:
    image: ghcr.io/${GHCR_OWNER:-fjacquet}/pstore_exporter:${PSTORE_TAG:-latest}
    container_name: test_pstore_exporter
    ports:
      - "9446:9446"
    volumes:
      - ./pstore-config.yaml:/etc/pstore_exporter/config.yaml:ro
    environment:
      - PSTORE1_HOSTNAME=${PSTORE1_HOSTNAME:-10.0.0.1}
      - PSTORE1_USERNAME=${PSTORE1_USERNAME:-admin}
      - PSTORE1_PASSWORD=${PSTORE1_PASSWORD:-}
      - PSTORE1_SKIP_CERTIFICATE=${PSTORE1_SKIP_CERTIFICATE:-false}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: test_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.test.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cee-exporter
      - pstore_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: test_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../pstore_exporter/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../pstore_exporter/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # foldersFromFilesStructure is on in the mounted provisioning config,
      # so this becomes its own "cee-exporter" folder in Grafana without
      # touching pstore_exporter's provisioning at all.
      - ../cee-exporter/dashboards:/var/lib/grafana/dashboards/cee-exporter:ro
      # The cee-exporter dashboard's panels expect datasource uid
      # cee-prometheus; pstore_exporter's provisioning only registers uid
      # prometheus. Same Prometheus instance, registered under the extra
      # uid, so the dashboard works unmodified.
      - ./grafana/cee-datasource.yml:/etc/grafana/provisioning/datasources/cee-datasource.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  pstcli:
    image: ghcr.io/${GHCR_OWNER:-fjacquet}/pstore-cli:latest
    container_name: test_pstcli
    platform: linux/amd64
    profiles: ["cli"]
    stdin_open: true
    tty: true
    working_dir: /work
    volumes:
      - ./state:/root
      - .:/work
