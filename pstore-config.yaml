server:
  host: "0.0.0.0"
  port: "9446"
  uri: "/metrics"
  logName: ""

collection:
  interval: "30s"
  timeout: "20s"

opentelemetry:
  metrics:
    enabled: false
  tracing:
    enabled: false

arrays:
  - name: pstore-1
    endpoint: "https://${PSTORE1_HOSTNAME}/api/rest"
    username: "${PSTORE1_USERNAME}"
    password: "${PSTORE1_PASSWORD}"
    insecureSkipVerify: true
